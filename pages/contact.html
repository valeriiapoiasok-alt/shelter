      <h1>Контакти</h1>
<p>Адреса: м. Ужгород, вулиця Заньковецької, 89, Ужгород, Закарпатська область, 88000
  (<a href="https://maps.app.goo.gl/fe1T5a3XGQe86DsF7"
      target="_blank" rel="noopener">показати на карті</a>)
</p>
    <p>Телефон: +380 (12) 3456789</p>
    <p>Email: <a href="mailto:valeriia.poiasok@student.uzhnu.edu.ua">valeriia.poiasok@student.uzhnu.edu.ua</a></p>
        <h2>Напишіть нам</h2>
    <form method="get">
      <p>
        <label for="name">Ім'я:</label>
        <input type="text" id="name" name="name" required>
      </p>
      <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
      </p>
      <p>
        <label for="phone">Телефон:</label>
        <input type="tel" id="phone" name="phone" placeholder="+380...">
      </p>
      <p>
        <label for="topic">Тема звернення:</label>
        <select id="topic" name="topic">
          <option value="adopt">Хочу взяти тварину</option>
          <option value="volunteer">Хочу стати волонтером</option>
          <option value="help">Хочу допомогти притулку</option>
          <option value="other">Інше</option>
        </select>
      </p>
      <p>
        <label for="message">Повідомлення:</label><br>
        <textarea id="message" name="message" rows="5" cols="40"></textarea>
      </p>
      <p>
        <input type="checkbox" id="agree" name="agree" required>
        <label for="agree">Погоджуюсь на обробку моїх даних</label>
      </p>
      <p>
        <button type="submit">Надіслати</button>
        <button type="reset">Очистити</button>
      </p>
    </form>
  </main>
